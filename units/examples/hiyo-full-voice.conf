# Optional example drop-in: production-style Hiyo voice + GPT Live.
# Install as ~/.config/systemd/user/hermes-echo-bridge.service.d/voice.conf
[Service]
ExecStart=
ExecStart=/home/ac/voice/echo-bridge/.venv/bin/python /home/ac/voice/echo-bridge/echo_server.py --host 192.168.0.212 --control --oneshot --oneshot-tts direct --live --vc --no-barge --led-mode exclusive --live-idle-timeout 120 --wakeword-wake --spotify --outdir /home/ac/voice/echo-bridge/captures
Environment=ECHO_LIBRESPOT=/home/ac/librespot-git
