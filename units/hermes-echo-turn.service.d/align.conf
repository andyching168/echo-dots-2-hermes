[Service]
# Align the Echo question-turn surface with the normal Hermes agent:
#   * no toolset exclusions (was: session_search,terminal,file,skills,...)
#   * connect ALL enabled MCP servers, not just `ha`
#   * agent iteration budget aligned with the normal agent
ExecStart=
ExecStart=/home/ac/.hermes/hermes-agent/venv/bin/python /home/ac/voice/echo-bridge/echo_turn_server.py --mcp-servers ha,brave-search,minimax,trello,accounting --exclude-toolsets= --max-iterations 90
